<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaChain — معلومات الدواء</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d9488">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PharmaChain">
    <link rel="apple-touch-icon" href="/icon.svg">
    <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pharma-styles.css">
    <script src="/pharma-lang.js"></script>
    <style>
        /* Remap blue palette → teal */
        :root {
            --blue-900: #0d3d38;
            --blue-800: #0f4c45;
            --blue-700: #0d6158;
            --blue-600: #0d9488;
            --blue-500: #14b8a6;
            --blue-400: #2dd4bf;
            --blue-300: #5eead4;
            --blue-200: #99f6e4;
            --blue-100: #ccfbf1;
            --blue-50:  #f0fdfa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', -apple-system, sans-serif;
            background: var(--gray-50);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 16px 60px;
        }

        .container {
            width: 100%;
            max-width: 560px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

            .header h1 {
                font-size: 22px;
                color: var(--blue-900);
                font-weight: 700;
            }

            .header p {
                font-size: 13px;
                color: var(--gray-500);
                margin-top: 4px;
            }

        .ai-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--blue-50);
            border: 1px solid var(--blue-200);
            color: var(--blue-600);
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            margin-top: 8px;
        }

        .ai-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--blue-600);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* Card */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            margin-bottom: 16px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .card-body {
            padding: 20px;
        }

        /* Form */
        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--gray-800);
            outline: none;
            font-family: inherit;
        }

            input[type="text"]:focus {
                border-color: var(--blue-400);
                box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
            }

        .level-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .level-btn {
            flex: 1;
            min-width: 100px;
            padding: 9px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
            background: white;
            color: var(--gray-600);
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-family: inherit;
        }

            .level-btn:hover {
                background: var(--gray-50);
            }

            .level-btn.selected {
                background: var(--blue-600);
                color: white;
                border-color: var(--blue-600);
            }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--blue-600), var(--blue-400));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37,99,235,0.32);
            transition: var(--t);
        }

            .btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 18px rgba(37,99,235,0.42);
            }

            .btn:disabled {
                background: var(--gray-400);
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

        /* Loading */
        .loading {
            text-align: center;
            padding: 24px;
            display: none;
        }

            .loading.show {
                display: block;
            }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--blue-600);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: var(--gray-500);
        }

        /* Result */
        .result-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            display: none;
        }

            .result-card.show {
                display: block;
            }

        .drug-hero {
            background: linear-gradient(135deg, var(--blue-900), var(--blue-600));
            padding: 20px;
            color: white;
        }

        .drug-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .drug-scientific {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .drug-category {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 11px;
        }

        .drug-sections {
            padding: 20px;
        }

        .drug-section {
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-body {
            font-size: 13px;
            color: var(--gray-600);
            line-height: 1.7;
        }

            .section-body ul {
                padding-inline-start: 18px;
            }

            .section-body li {
                margin-bottom: 4px;
            }

        .warning-box {
            background: var(--amber-50);
            border: 1px solid var(--amber-200);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 13px;
            color: #92400e;
            line-height: 1.6;
        }

        .interaction-box {
            background: var(--rose-50);
            border: 1px solid var(--rose-200);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 13px;
            color: #822727;
            line-height: 1.6;
        }

        .divider {
            height: 1px;
            background: var(--gray-200);
            margin: 16px 0;
        }

        .disclaimer {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 11px;
            color: var(--gray-500);
            text-align: center;
            margin: 0 20px 20px;
            border: 1px solid var(--gray-200);
        }

        /* New search */
        .new-search {
            padding: 0 20px 20px;
        }

        .btn-outline {
            width: 100%;
            padding: 10px;
            background: white;
            color: var(--blue-600);
            border: 1px solid var(--blue-600);
            border-radius: var(--radius-md);
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

            .btn-outline:hover {
                background: var(--blue-50);
            }

        /* Error */
        .error-msg {
            background: var(--rose-50);
            border: 1px solid var(--rose-200);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--rose-600);
            margin-top: 10px;
            display: none;
        }

            .error-msg.show {
                display: block;
            }

        /* Popular drugs */
        .popular-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.2s;
        }

            .chip:hover {
                background: var(--blue-50);
                border-color: var(--blue-200);
                color: var(--blue-600);
            }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--blue-500);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="lang-toggle-float" onclick="PharmaLang.toggle()">🇬🇧 EN</button>
    <div class="container">

        <div class="header">
            <h1 data-i18n="di_title">💊 معلومات الدواء</h1>
            <p data-i18n="di_sub">اعرف أكثر عن دوائك — بلغة سهلة وواضحة</p>
            <div class="ai-tag">
                <div class="ai-dot"></div>
                <span data-i18n="di_ai_tag">مدعوم بالذكاء الاصطناعي</span>
            </div>
        </div>

        <!-- Search card -->
        <div class="card" id="searchCard">
            <div class="card-header" data-i18n="di_search_hdr">🔍 ابحث عن دواء</div>
            <div class="card-body">

                <div class="form-group">
                    <label class="form-label" data-i18n="di_name_label">اسم الدواء (عربي أو إنجليزي)</label>
                    <input type="text" id="drugInput"
                           placeholder="مثال: Paracetamol / باراسيتامول / Amoxicillin"
                           data-i18n-ph="di_name_ph"
                           onkeydown="if(event.key==='Enter') search()">
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="di_level_label">مستوى المعلومات</label>
                    <div class="level-btns">
                        <button class="level-btn selected" onclick="selectLevel('patient', this)" data-i18n="di_lvl_patient">
                            👤 للمريض
                        </button>
                        <button class="level-btn" onclick="selectLevel('pharmacist', this)" data-i18n="di_lvl_pharmacist">
                            🏥 للصيدلاني
                        </button>
                        <button class="level-btn" onclick="selectLevel('medical', this)" data-i18n="di_lvl_medical">
                            🩺 طبي تفصيلي
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="di_popular">أدوية شائعة — اضغط للبحث مباشرة</label>
                    <div class="popular-chips">
                        <span class="chip" onclick="quickSearch('Paracetamol')">Paracetamol</span>
                        <span class="chip" onclick="quickSearch('Amoxicillin')">Amoxicillin</span>
                        <span class="chip" onclick="quickSearch('Ibuprofen')">Ibuprofen</span>
                        <span class="chip" onclick="quickSearch('Metformin')">Metformin</span>
                        <span class="chip" onclick="quickSearch('Omeprazole')">Omeprazole</span>
                        <span class="chip" onclick="quickSearch('Aspirin')">Aspirin</span>
                    </div>
                </div>

                <button class="btn" id="searchBtn" onclick="search()">
                    <span data-i18n="di_btn">🔬 ابحث عن الدواء</span>
                </button>

                <div class="error-msg" id="errorMsg"></div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text" data-i18n="di_loading">جاري البحث عن معلومات الدواء...</div>
        </div>

        <!-- Result -->
        <div class="result-card" id="resultCard">
            <div class="drug-hero" id="drugHero"></div>
            <div class="drug-sections" id="drugSections"></div>
            <div class="disclaimer" data-i18n="di_disclaimer">
                ⚠️ هذه المعلومات للتثقيف الصحي فقط — استشر طبيبك أو صيدلانيك دائماً قبل استخدام أي دواء
            </div>
            <div class="new-search">
                <button class="btn-outline" onclick="newSearch()" data-i18n="di_new_search">🔍 البحث عن دواء آخر</button>
            </div>
        </div>

        <div class="back-link" onclick="goBack()" data-i18n="di_back">← العودة للخلف</div>

    </div>

        var API = 'http://localhost:7036';
        var selectedLevel = 'patient';

        function selectLevel(level, btn) {
            selectedLevel = level;
            document.querySelectorAll('.level-btn').forEach(function (b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
        }

        function quickSearch(name) {
            document.getElementById('drugInput').value = name;
            search();
        }

        function goBack() {
            // إذا كان المستخدم logged in ارجعه للـ dashboard، وإلا للخلف
            var token = localStorage.getItem('token');
            if (token) { window.location.replace(API + '/dashboard.html'); }
            else { history.back(); }

        async function search() {
            var name = document.getElementById('drugInput').value.trim();
            if (!name) { showError(PharmaLang.t('dinfo_no_drug_err')); return; }

            hideError();
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultCard').classList.remove('show');

            await new Promise(function (r) { setTimeout(r, 800 + Math.random() * 600); });

            try {
                var key = name.toLowerCase().trim();
                var result = drugDatabase[key];

                if (!result) {
                    for (var k in drugDatabase) {
                        if (k.includes(key) || key.includes(k)) {
                            result = drugDatabase[k];
                            break;
                        }
                    }
                }

                if (!result) {
                    showError(PharmaLang.t('dinfo_not_found'));
                    return;
                }

                renderResult(result);
            } catch (e) {
                showError(PharmaLang.t('dinfo_error'));
            } finally {
                document.getElementById('searchBtn').disabled = false;
                document.getElementById('loading').classList.remove('show');
            }
        }

        function renderResult(r) {
            var lang = PharmaLang.get();
            var d = (r[lang] || r.ar || r);

            // Hero
            document.getElementById('drugHero').innerHTML =
                '<div class="drug-name">' + (d.name || r.name || '') + '</div>' +
                '<div class="drug-scientific">' + (r.scientific || '') + '</div>' +
                '<span class="drug-category">' + (d.category || '') + '</span>';

            // Sections
            var html = '';
            var titles = {
                use: PharmaLang.t('dinfo_sec_use'),
                dose: PharmaLang.t('dinfo_sec_dose'),
                warnings: PharmaLang.t('dinfo_sec_warn'),
                side: PharmaLang.t('dinfo_sec_side'),
                interactions: PharmaLang.t('dinfo_sec_inter'),
                storage: PharmaLang.t('dinfo_sec_store')
            };

            if (d.use) {
                html += section(titles.use, '<p>' + d.use + '</p>');
            }

            if (d.dose) {
                html += section(titles.dose, '<p>' + d.dose + '</p>');
            }

            if (d.warnings && d.warnings.length) {
                html += '<div class="drug-section"><div class="section-title">' + titles.warnings + '</div>' +
                    '<div class="warning-box"><ul>' +
                    d.warnings.map(function (w) { return '<li>' + w + '</li>'; }).join('') +
                    '</ul></div></div>';
            }

            if (d.sideEffects && d.sideEffects.length) {
                html += section(titles.side,
                    '<ul>' + d.sideEffects.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>');
            }

            if (d.interactions) {
                html += '<div class="drug-section"><div class="section-title">' + titles.interactions + '</div>' +
                    '<div class="interaction-box">' + d.interactions + '</div></div>';
            }

            if (d.storage) {
                html += section(titles.storage, '<p>' + d.storage + '</p>');
            }

            document.getElementById('drugSections').innerHTML = html;
            document.getElementById('resultCard').classList.add('show');
        }

        function section(title, body) {
            return '<div class="drug-section">' +
                '<div class="section-title">' + title + '</div>' +
                '<div class="section-body">' + body + '</div>' +
                '</div>';
        }

        function newSearch() {
            document.getElementById('resultCard').classList.remove('show');
            document.getElementById('drugInput').value = '';
            document.getElementById('drugInput').focus();
        }

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        window.addEventListener('pharmaLangChanged', function() {
            // If a result is shown, re-render it
            if (document.getElementById('resultCard').classList.contains('show')) {
                var key = document.getElementById('drugInput').value.trim().toLowerCase();
                var result = drugDatabase[key];
                if (!result) {
                    for (var k in drugDatabase) {
                        if (k.includes(key) || key.includes(k)) { result = drugDatabase[k]; break; }
                    }
                }
                if (result) renderResult(result);
            }
        });
    </script>
