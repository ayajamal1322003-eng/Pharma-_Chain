<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaChain — تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

            .logo h1 {
                font-size: 24px;
                color: #1a365d;
                font-weight: 700;
            }

            .logo p {
                font-size: 13px;
                color: #718096;
                margin-top: 4px;
            }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
        }

            input:focus {
                border-color: #3182ce;
            }

        .btn {
            width: 100%;
            padding: 12px;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }

            .btn:hover {
                background: #2c5282;
            }

            .btn:disabled {
                background: #a0aec0;
                cursor: not-allowed;
            }

        .error {
            background: #fff5f5;
            color: #c53030;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            border: 1px solid #feb2b2;
            line-height: 1.6;
        }

        .warning {
            background: #fff8e1;
            color: #744210;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            border: 1px solid #f6cc5b;
        }

        .attempts-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .attempts-fill {
            height: 100%;
            background: #e53e3e;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            margin-top: 20px;
            font-size: 12px;
            color: #718096;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #48bb78;
        }

        .password-hint {
            font-size: 11px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>PharmaChain</h1>
            <p>نظام تتبع الأدوية الآمن</p>
        </div>
        <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group">
            <label>كلمة السر</label>
            <input type="password" id="password" placeholder="أدخل كلمة السر">
            <div class="password-hint">يجب أن تحتوي على 8 أحرف + رقم + حرف كبير</div>
        </div>
        <div class="attempts-bar" id="attemptsBar">
            <div class="attempts-fill" id="attemptsFill"></div>
        </div>
        <button class="btn" id="loginBtn" onclick="login()">دخول</button>
        <div class="error" id="errorMsg"></div>
        <div class="warning" id="warningMsg"></div>
        <div class="security-badge">
            <div class="dot"></div>
            <span>محمي بتشفير JWT + BCrypt</span>
        </div>
    </div>
    <script>
        var API = 'http://localhost:7036';
        var failedAttempts = 0;
        async function login() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');
            if (!username || !password) { showError('يرجى إدخال اسم المستخدم وكلمة السر'); return; }
            btn.disabled = true; btn.textContent = 'جاري الدخول...'; hideMessages();
            try {
                var res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                var data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
                    window.location.replace(API + '/dashboard.html');
                } else if (res.status === 429) {
                    showError('🔒 ' + data.message + '\n' + (data.details || ''));
                    btn.disabled = true; btn.textContent = 'محجوب مؤقتاً';
                    setTimeout(function () { btn.disabled = false; btn.textContent = 'دخول'; failedAttempts = 0; updateAttemptsBar(0); }, 300000);
                } else {
                    failedAttempts++;
                    updateAttemptsBar(failedAttempts);
                    var remaining = data.remainingAttempts || (5 - failedAttempts);
                    showError('اسم المستخدم أو كلمة السر غلط\nالمحاولات المتبقية: ' + remaining + ' من 5');
                    if (remaining <= 2) showWarning('تحذير: بعد ' + remaining + ' محاولة فاشلة سيتم حجب الحساب لمدة 5 دقائق');
                }
            } catch (e) { showError('تعذر الاتصال بالسيرفر'); }
            finally { if (!btn.disabled) { btn.disabled = false; btn.textContent = 'دخول'; } }
        }
        function updateAttemptsBar(a) { document.getElementById('attemptsBar').style.display = 'block'; document.getElementById('attemptsFill').style.width = (a * 20) + '%'; }
        function showError(msg) { var el = document.getElementById('errorMsg'); el.style.whiteSpace = 'pre-line'; el.textContent = msg; el.style.display = 'block'; }
        function showWarning(msg) { document.getElementById('warningMsg').textContent = msg; document.getElementById('warningMsg').style.display = 'block'; }
        function hideMessages() { document.getElementById('errorMsg').style.display = 'none'; document.getElementById('warningMsg').style.display = 'none'; }
        document.addEventListener('keypress', function (e) { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
