<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaChain — تسجيل الدخول</title>
    <link rel="stylesheet" href="/pharma-styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f1635 0%, #1e2d5e 50%, #0f2460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            padding: 44px 40px 36px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 34px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(37,99,235,0.4);
        }

        .logo-title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                font-size: 13px;
                font-weight: 600;
                color: var(--gray-600);
                display: block;
                margin-bottom: 7px;
            }

        .input-wrap {
            position: relative;
        }

        .input-prefix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: var(--gray-400);
            pointer-events: none;
        }

        .input-wrap input {
            padding-right: 42px;
            padding: 11px 14px 11px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            font-size: 14px;
            color: var(--gray-800);
            outline: none;
            background: var(--gray-50);
            width: 100%;
            transition: all 0.2s;
            font-family: inherit;
        }

            .input-wrap input:focus {
                border-color: #2563eb;
                background: white;
                box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
            }

        .attempts-bar {
            height: 4px;
            background: var(--gray-200);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .attempts-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1e40af, #2563eb, #3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(37,99,235,0.35);
            letter-spacing: 0.3px;
        }

            .btn-login:hover:not(:disabled) {
                transform: translateY(-1px);
                box-shadow: 0 8px 24px rgba(37,99,235,0.45);
            }

            .btn-login:disabled {
                background: var(--gray-300);
                color: var(--gray-500);
                cursor: not-allowed;
                box-shadow: none;
                transform: none;
            }

        .error-box {
            background: var(--rose-50);
            border: 1.5px solid var(--rose-200);
            color: #881337;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            line-height: 1.7;
            white-space: pre-line;
        }

        .warning-box {
            background: var(--amber-50);
            border: 1.5px solid var(--amber-200);
            color: #78350f;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .security-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-100);
        }

        .sec-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald-500);
            animation: pulse 2s ease infinite;
        }

        .sec-text {
            font-size: 12px;
            color: var(--gray-500);
        }

        .pwd-hint {
            font-size: 11px;
            color: var(--gray-400);
            margin-top: 5px;
        }

        /* Background decoration */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }

        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            top: -150px;
            left: -100px;
        }

        .bg-orb-2 {
            width: 400px;
            height: 400px;
            background: #06b6d4;
            bottom: -100px;
            right: -80px;
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">⛓️</div>
                <div class="logo-title">PharmaChain</div>
                <div class="logo-sub">نظام تتبع الأدوية الآمن</div>
            </div>

            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrap">
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم">
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور">
                </div>
                <div class="pwd-hint">يجب أن تحتوي على 8 أحرف + رقم + حرف كبير</div>
            </div>

            <div class="attempts-bar" id="attemptsBar">
                <div class="attempts-fill" id="attemptsFill"></div>
            </div>

            <button class="btn-login" id="loginBtn" onclick="login()">دخول إلى النظام</button>

            <div class="error-box" id="errorMsg"></div>
            <div class="warning-box" id="warningMsg"></div>

            <div class="security-strip">
                <div class="sec-dot"></div>
                <div class="sec-text">محمي بتشفير JWT + BCrypt · Blockchain Protection</div>
            </div>
        </div>
    </div>

    <script>
        var API = 'http://localhost:7036';
        var failedAttempts = 0;

        async function login() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');
            if (!username || !password) { showError('يرجى إدخال اسم المستخدم وكلمة المرور'); return; }
            btn.disabled = true; btn.textContent = '⏳ جاري التحقق...'; hideMessages();
            try {
                var res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                var data = await res.json();
                if (res.ok) {
                    btn.textContent = '✅ تم التحقق — جاري الدخول...';
                    localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
                    window.location.replace(API + '/dashboard.html');
                } else if (res.status === 429) {
                    showError('🔒 ' + data.message + '\n' + (data.details || ''));
                    btn.disabled = true; btn.textContent = 'محجوب مؤقتاً';
                    setTimeout(function () { btn.disabled = false; btn.textContent = 'دخول إلى النظام'; failedAttempts = 0; updateAttemptsBar(0); }, 300000);
                } else {
                    failedAttempts++;
                    updateAttemptsBar(failedAttempts);
                    var remaining = data.remainingAttempts || (5 - failedAttempts);
                    showError('اسم المستخدم أو كلمة المرور غير صحيحة\nالمحاولات المتبقية: ' + remaining + ' من 5');
                    if (remaining <= 2) showWarning('⚠️ تحذير: بعد ' + remaining + ' محاولة فاشلة سيتم حجب الحساب لمدة 5 دقائق');
                }
            } catch (e) { showError('⚠️ تعذر الاتصال بالسيرفر — تأكد من تشغيل التطبيق'); }
            finally { if (btn.textContent !== '✅ تم التحقق — جاري الدخول...') { btn.disabled = false; btn.textContent = 'دخول إلى النظام'; } }
        }

        function updateAttemptsBar(a) { document.getElementById('attemptsBar').style.display = 'block'; document.getElementById('attemptsFill').style.width = (a * 20) + '%'; }
        function showError(msg) { var el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }
        function showWarning(msg) { document.getElementById('warningMsg').textContent = msg; document.getElementById('warningMsg').style.display = 'block'; }
        function hideMessages() { document.getElementById('errorMsg').style.display = 'none'; document.getElementById('warningMsg').style.display = 'none'; }
        document.addEventListener('keypress', function (e) { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
